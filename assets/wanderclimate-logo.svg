<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">WanderClimate logo</title>
  <desc id="desc">A golden sun above alpine peaks and flowing teal waves, representing climate-aware journeys.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2b22"/>
      <stop offset="1" stop-color="#3f6b4a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8f94"/>
      <stop offset="1" stop-color="#79b8af"/>
    </linearGradient>
    <clipPath id="round"><rect x="3" y="3" width="90" height="90" rx="23"/></clipPath>
  </defs>
  <rect x="3" y="3" width="90" height="90" rx="23" fill="url(#sky)"/>
  <g clip-path="url(#round)">
    <circle cx="65" cy="31" r="15" fill="#e0b65a"/>
    <path d="M9 63 30 39l15 17 12-13 28 28" fill="none" stroke="#f7f5e9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M7 69c13-11 27-11 40 0s26 11 43 0" fill="none" stroke="url(#sea)" stroke-width="10" stroke-linecap="round"/>
    <path d="M7 83c13-11 27-11 40 0s26 11 43 0" fill="none" stroke="#d7eadb" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="3" y="3" width="90" height="90" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
</svg>
