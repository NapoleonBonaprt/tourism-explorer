name: Cache original city photos
on:
  push:
    branches: [forecast-development]
    paths:
      - 'scripts/cache_original_city_photos.py'
      - '.github/workflows/cache-city-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow
      - run: python scripts/cache_original_city_photos.py
        env:
          PHOTO_TRANSFER_LOG: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-city-photos
          path: |
            assets/cities/cairo.jpg
            assets/cities/lisbon.jpg
            assets/cities/paris.jpg
            assets/cities/rome.jpg
            assets/cities/tokyo.jpg
