name: Forecast integration checks
on:
  push:
    branches: [forecast-development]
    paths:
      - 'forecast_service.py'
      - 'website_api.py'
      - 'dashboard-site.js'
      - 'scripts/test_forecast*.py'
      - 'requirements-deploy.txt'
      - '.github/workflows/forecast-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-deploy.txt httpx playwright
      - run: python -m compileall -q forecast_service.py website_api.py scripts
      - run: python scripts/test_forecast.py
      - run: python -m playwright install --with-deps chromium
      - name: Start website and test browser
        run: |
          python -m uvicorn web_server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat server.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          python scripts/test_forecast_browser.py
