name: Forecast integration checks
on:
  push:
    branches: [main, forecast-development, repository-organization]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'streamlit_ui/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'api.py'
      - 'web_server.py'
      - 'dashboard.py'
      - 'requirements-deploy.txt'
      - 'cleaned_data/**'
      - 'python files/forecast_results/**'
      - 'python files/monthly_weather_results/**'
      - '.github/workflows/forecast-checks.yml'
  pull_request:
    branches: [main, forecast-development]
  workflow_dispatch:
concurrency:
  group: forecast-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-deploy.txt httpx playwright pypdf
      - run: python -m compileall -q backend frontend streamlit_ui scripts tests api.py web_server.py dashboard.py
      - run: python scripts/train_weather_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-weather-results
          path: python files/monthly_weather_results/
      - run: python tests/test_forecast.py
      - run: python -m playwright install --with-deps chromium
      - name: Start website and test browser
        run: |
          python -m uvicorn web_server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat server.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          python tests/test_forecast_browser.py
          python tests/test_site_full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-screenshots
          path: site-test-artifacts/
          if-no-files-found: ignore
